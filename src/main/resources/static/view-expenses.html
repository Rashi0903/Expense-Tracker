<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>View Expenses</title>

<link rel="stylesheet" href="style.css?v=6">
<script src="auth.js?v=3" defer></script>
<script src="script.js?v=7" defer></script>

</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

        <h2 class="logo">Expense</h2>

        <ul class="menu">

            <li onclick="goToDashboard()">Dashboard</li>
            <li onclick="goToAddExpense()">Add Expense</li>
            <li onclick="goToAnalytics()">Analytics</li>
            <li class="active" onclick="goToViewExpenses()">View Expenses</li>

        </ul>

        <button class="logout" onclick="doLogout()">Logout</button>

    </div>


    <!-- Main -->
    <div class="main">

        <div class="header">

            <h1>View Expenses</h1>

            <div class="profile">
                <span id="profileName">User</span>
            </div>

        </div>


        <div class="search-box">

            <input id="searchInput" type="text" placeholder="Search by title, category, date or amount..." aria-label="Search expenses">
            <button id="searchBtn" class="search-btn" type="button">Search</button>

        </div>


        <div class="table-section">

            <h3>All Expenses</h3>

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="expenseTable">
                    <tr>
                        <td colspan="5">Loading expenses...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
